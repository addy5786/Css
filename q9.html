<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .linear{
            background: linear-gradient(to right, rgb(0, 8, 255), blue, violet, pink, rgb(208, 0, 255) );
            color: white;
            text-align: center;
            padding: 60px;
            margin: 20px 37%;
        }
        .radial{
            background: radial-gradient(circle, rgb(9, 255, 0), blue, violet, pink, rgb(119, 0, 255) );
            color: rgba(255, 255, 255, 0.488);
            text-align: center;
            padding: 60px;
            margin: 20px 37%;
        }
    </style>
</head>
<body bgcolor="grey">
    <div class="linear"><p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Maiores, nesciunt.</p></div>
    <div class="radial"><p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptates, harum?</p></div>
</body>
</html>
